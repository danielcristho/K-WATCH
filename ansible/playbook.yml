---
- name: Gathering Facts
  hosts: all
  become: true
  remote_user: ubuntu

- name: Setup Configuration & Tools
  hosts: all
  become: true
  roles: [config]

- name: Setup Base Kubernetes
  hosts: all
  become: true
  roles: [k8s-base]

- name: Setup k3s
  hosts: all
  become: true
  roles:
    - role: k3s
      when: k8s_distro == 'k3s'

- name: Setup Master
  hosts: masters
  become: true
  roles:
    - role: master
      when: k8s_distro == 'kubeadm'

- name: Setup Worker
  hosts: workers:siem
  become: true
  roles:
    - role: worker
      when: k8s_distro == 'kubeadm'

- name: Install cluster CLIs
  hosts: masters
  become: true
  roles: [cli-tools]

- name: Setup Cilium & Hubble
  hosts: masters
  become: true
  roles: [cilium]

- name: Setup Tetragon
  hosts: masters
  become: true
  roles: [tetragon]

- name: Apply Node Labels & Taints
  hosts: masters
  become: true
  tasks:
    - name: Require an up-to-date inventory
      ansible.builtin.assert:
        that: groups['siem'] is defined
        fail_msg: "No [siem] group. Re-run terraform/generate-inventory.sh."

    - name: Label and taint workers
      ansible.builtin.shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl label node {{ item }} node-role.kubernetes.io/worker="" --overwrite
        kubectl taint node {{ item }} role=worker:NoSchedule --overwrite
      loop: "{{ groups['workers'] }}"
      changed_when: true

    - name: Label and taint SIEM
      ansible.builtin.shell: |
        export KUBECONFIG={{ kubeconfig_path }}
        kubectl label node {{ item }} node-role.kubernetes.io/siem="" --overwrite
        kubectl taint node {{ item }} role=siem:NoSchedule --overwrite
      loop: "{{ groups['siem'] }}"
      changed_when: true