---
# Tasks file for master
# Check if k3s is already installed
- name: Check if cluster already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_check

# Configure kubelet node-ip for kubeadm
- name: Configure kubelet node-ip
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ hostvars[inventory_hostname]['private_ip'] }}"

# Initialize Kubernetes cluster with kubeadm
- name: Initialize Kubernetes cluster
  ansible.builtin.shell: |
    kubeadm init \
      --apiserver-advertise-address={{ hostvars[inventory_hostname]['private_ip'] }} \
      --apiserver-cert-extra-sans={{ hostvars[inventory_hostname]['ansible_host'] }} \
      --pod-network-cidr={{ k8s_pod_cidr }} \
      --service-cidr={{ k8s_service_cidr }} \
      --skip-phases=addon/kube-proxy \
      --node-name={{ inventory_hostname }}
  when: not kubeadm_init_check.stat.exists

# Setup kubeconfig for ubuntu and root
- name: Setup kubeconfig for ubuntu and root
  ansible.builtin.shell: |
    mkdir -p /home/{{ ansible_user }}/.kube /root/.kube
    cp /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config
    cp /etc/kubernetes/admin.conf /root/.kube/config
    chown -R {{ ansible_user }}:{{ ansible_user }} /home/{{ ansible_user }}/.kube
  changed_when: true

# Update kubeconfig server to use public IP
- name: Update kubeconfig server to use public IP
  ansible.builtin.replace:
    path: /etc/kubernetes/admin.conf
    regexp: 'https://{{ hostvars[inventory_hostname]["private_ip"] }}:6443'
    replace: 'https://{{ hostvars[inventory_hostname]["ansible_host"] }}:6443'

# Copy updated kubeconfig to user directories
- name: Copy updated kubeconfig to user directories
  ansible.builtin.shell: |
    cp /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config
    cp /etc/kubernetes/admin.conf /root/.kube/config
    chown -R {{ ansible_user }}:{{ ansible_user }} /home/{{ ansible_user }}/.kube
  changed_when: true

# Fetch kubeconfig and join command to controller
- name: Fetch kubeconfig and join command
  ansible.builtin.shell: |
    kubeadm token create --print-join-command > /tmp/kubeadm_join_command
  changed_when: false

- name: Fetch files to controller
  ansible.builtin.fetch:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    flat: yes
  loop:
    - { src: "/etc/kubernetes/admin.conf", dest: "./kubeconfig" }
    - { src: "/tmp/kubeadm_join_command", dest: "./kubeadm_join_command" }