---
# This role sets up the base requirements for Kubernetes on Ubuntu 22.04
# Disable swap
- name: Disable swap
  ansible.builtin.shell: |
    swapoff -a
    sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
  changed_when: true

# Load kernmod
- name: Load kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

# Activate kernmods
- name: Activate kernel modules
  ansible.builtin.shell: |
    modprobe overlay
    modprobe br_netfilter
  changed_when: true

# Set sysctl params
- name: Set sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

# Apply sysctl settings
- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

# Install base deps
- name: Install base dependencies
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, software-properties-common]
    state: present
    update_cache: true

# k3s ships its own containerd and kubectl, so everything below is kubeadm only
- name: Add Kubernetes apt keyring
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | \
      gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: k8s_distro == 'kubeadm'

# Add Kubernetes apt repository
- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
  when: k8s_distro == 'kubeadm'

# Install containerd, kubeadm, kubelet, and kubectl for kubeadm
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
  when: k8s_distro == 'kubeadm'

- name: Configure containerd
  ansible.builtin.shell: |
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  changed_when: true
  when: k8s_distro == 'kubeadm'

- name: Restart and enable containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
  when: k8s_distro == 'kubeadm'

- name: Install kubeadm, kubelet, kubectl
  ansible.builtin.apt:
    name: [kubeadm, kubelet, kubectl]
    state: present
    update_cache: true
  when: k8s_distro == 'kubeadm'

# Hold kube versions
- name: Hold kube versions
  ansible.builtin.command: apt-mark hold kubeadm kubelet kubectl
  changed_when: true
  when: k8s_distro == 'kubeadm'

# Open Hubble port
- name: Open Hubble port
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "4244"
    jump: ACCEPT
    action: insert
