# Source: 
# https://github.com/cilium/tetragon/blob/main/docs/content/en/docs/concepts/tracing-policy/selectors.md
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ids-syscall-monitoring
spec:
  kprobes:
    - call: "sys_openat"
      syscall: true
    # Memory management
    - call: "sys_mmap"
      syscall: true
    - call: "sys_mprotect"
      syscall: true
    - call: "sys_brk"
      syscall: true
    # Network operations
    - call: "sys_socket"
      syscall: true
    - call: "sys_connect"
      syscall: true
    - call: "sys_accept"
      syscall: true
    - call: "sys_sendto"
      syscall: true
    - call: "sys_recvfrom"
      syscall: true
    # Process management
    - call: "sys_clone"
      syscall: true
    - call: "sys_execve"
      syscall: true
    - call: "sys_exit_group"
      syscall: true
    - call: "sys_kill"
      syscall: true
    # Timing/scheduling
    - call: "sys_nanosleep"
      syscall: true
    # I/O control
    - call: "sys_ioctl"
      syscall: true
    - call: "sys_epoll_pwait"
      syscall: true
